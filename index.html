<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="culturama-favico.png">
    <link rel="stylesheet" href="css/sytle.css"
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fjalla+One&family=Work+Sans&display=swap" rel="stylesheet">
    <title>Culturama</title>
</head>

<body>
    <main>
 <header>
        <img src="img/logo-culturama.png" alt="logo-culturama">
        <h1>Pesquisa Online</h1>
    </header>
    <section>
        <form action=" " method="get">
            <fieldset>
                <legend> Dados Pessoais</legend>
                <label for="name">Nome:</label>
                <input id="name" type="text" name="userName" required>
                <br>

                <label for="age">Idade:</label>
                <input id="age" type="number" name="age" min="12" max="100" required>
                <br>

                <label for="birthdade">Dada de Nascimento:</label>
                <input id = "birthdade" type="date" name="birthdade">
                <br>

                <label for="Email">Email:</label>
                <input id="Email" type="email" name="userEmail" required>
                <br>

                <label for="phone">Telefone:</label>
                <input id= "phone" type="tel" name="userPhone" pattern="[0-9]{11}" placeholder="(DD) + número">
                <br>

                <label for="Image">Foto:</label>
                <input id="Image"type="file" accept="image/*" name="userImage">
                <br>    
            </fieldset> 

            <fieldset>
                <legend>Perfil</legend>

                <p>Gênero:</p>
                <input id= "fem" type ="radio" name="userGender" value="Feminino">
                <label for ="fem">Feminino</label>
                <input id= "mas" type ="radio" name="userGender" value="Masculino">
                <label for ="mas">Masculino</label>
                <input id= "naoInformar" type ="radio" name="userGender" value="notInformed">
                <label for ="naoInformar">Prefiro Não Informar</label>
                <br>

                <label for="maritalStatus">Estado Cívil:</label>
                <select id="maritalStatus" name="userMritalStatus">
                    <option value="notInformed">Selecione</option>
                    <option value="Casado">Casado</option>
                    <option value="Solteiro">Solteiro</option>
                    <option value="Divorciado">Divorciado</option>
                </select>
                <br>

                <label for="State">Estados:</label>
                <select id="State" name="State">
                    <option value="notInformed">Selecione</option>
                    <option value="Acre">Acre</option>
                    <option value="Alagoas">Alagoas</option>
                    <option value="Amapá">Amapá</option>
                    <option value="Amazonas">Amazonas</option>
                    <option value="Bahia">Bahia</option>
                    <option value="Ceará">Ceará</option>
                    <option value="Distrito Federal">Distrito Federal</option>
                    <option value="Espirito Santo">Espirito Santo</option>
                    <option value="Goiás">Goiás</option>
                    <option value="Maranhão">Maranhão</option>
                    <option value="Mato Grosso do Sul">Mato Grosso do Sul</option>
                    <option value="Mato Grosso">Mato Grosso</option>
                    <option value="Minas Gerais">Minas Gerais</option>
                    <option value="Pará">Pará</option>
                    <option value="Paraíba">Paraíba</option>
                    <option value="Paraná">Paraná</option>
                    <option value="Pernambuco">Pernambuco</option>
                    <option value="Piauí">Piauí</option>
                    <option value="Rio de Janeiro">Rio de Janeiro</option>
                    <option value="Rio Grande do Norte">Rio Grande do Norte</option>
                    <option value="Rio Grande do Sul">Rio Grande do Sul</option>
                    <option value="Rondônia">Rondônia</option>
                    <option value="Roraima">Roraima</option>
                    <option value="Santa Catarina">Santa Catarina</option>
                    <option value="São Paulo">São Paulo</option>
                    <option value="Sergipe">Sergipe</option>
                    <option value="Tocantins">Tocantins</option>
                </select>

            </fieldset> 

            <fieldset>
                <legend>Hábitos</legend>
                
                <p>Redes Sociais:</p>
                <input id="Instagram" type="checkbox" name="social" value="instagram">
                <label for="Instagram">Instagram</label>
                <br>

                <input id="facebook" type="checkbox" name="social" value="facebook">
                <label for="facebook">Facebook</label>
                <br>

                <input id="Linkedin" type="checkbox" name="social" value="Linkedin">
                <label for="Linkedin">Linkedin</label>
                <br>

                <input id="X" type="checkbox" name="social" value="X">
                <label for="X">X</label>
                <br>


                <label for="musicStyle">Estilo Musical</label>
                <input list="SytleTypes" id="musicStyle" name="userMusicStyle" type="text">
                <datalist id="SytleTypes">
                    <option value="Rock">
                    <option value="Pop">
                    <option value="Alternativo">
                    <option value="Eletronica">
                </datalist>
                
                <br>
                <label for="favoriteColor">Cor Favorita</label>
                <input type="color" name="userFavoriteColor" id="favoriteColor">

            </fieldset>
            <fieldset>            
                <legend>Opinião</legend>
                <p>O que você acha da qualidade do nosso serviço?</p>

                <input id= "otimo" type ="radio" name="userOpinion" value="Otimo">
                <label for ="otimo">Ótimo</label><br>
                
                <input type="radio" id="boa"
                name="userServiceOpinion" value="boa">
                <label for="boa">Boa</label><br>

                <input type="radio" id="regular" name="userServiceOpinion" value="regular">
                <label for="regular">Regular</label><br>

                <input type="radio" id="ruim" name="userServiceOpinion" value="ruim">
                <label for="ruim">Ruim</label><br>

                <label for="comment">Escreva sua opinião:</label>
                <textarea id="comment" name="userComment" placeholder="Digite aqui sua opinião..."></textarea>
            </fieldset>

            <fieldset>            
                <legend>Confirmações</legend>

                <input type="checkbox" name="userLGPD" id="userLgpdTerm" value="accept"  required>
                <label for="userLgpdTerm">Eu aceito participar da pesquisa</label><br>

                <input type="checkbox" name="userGetEesult" id="getResult" value="accept">
                <label for="getResult">Desejo receber o resultado por email</label><br>

            </fieldset>

            <button type="submit">Enviar</button> 
            <button type="reset">Limpar</button> 


        </form>
    </section>
    </main>
   
</body>
</html>
